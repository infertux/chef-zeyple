---
driver:
  name: dokken
  privileged: true # allows systemd services to start
  chef_image: cincproject/cinc
  chef_version: <%= ENV.fetch('CHEF_VERSION', 18) %>

provisioner:
  name: dokken
  product_name: cinc
  chef_binary: /opt/cinc/bin/cinc-client
  deprecations_as_errors: true
  multiple_converge: 2
  enforce_idempotency: true

transport:
  name: dokken

verifier:
  name: inspec

platforms:
  # @see https://github.com/chef-cookbooks/testing_examples/blob/main/kitchen.dokken.yml
  # @see https://hub.docker.com/u/dokken
  - name: debian-12
    driver:
      image: dokken/debian-12
      pid_one_command: /lib/systemd/systemd
      intermediate_instructions:
        - RUN /usr/bin/apt-get update
        - RUN /usr/bin/apt-get upgrade -y
  - name: debian-13
    driver:
      image: dokken/debian-13
      pid_one_command: /lib/systemd/systemd
      intermediate_instructions:
        - RUN /usr/bin/apt-get update
        - RUN /usr/bin/apt-get upgrade -y
  - name: ubuntu-24.04
    driver:
      image: dokken/ubuntu-24.04
      pid_one_command: /lib/systemd/systemd
      intermediate_instructions:
        - RUN /usr/bin/apt-get update
        - RUN /usr/bin/apt-get upgrade -y

suites:
  - name: default
    run_list:
      - recipe[postfix::server]
      - recipe[zeyple::default]
      - recipe[zeyple_test::default]
    attributes:
      zeyple:
        gpg:
          keys: ["0xEEC73D5809A98A9B"]
        # TODO: remove once Zeyple v2.0.0 is tagged (https://github.com/infertux/zeyple/pull/78)
        upstream:
          script:
            url: https://raw.githubusercontent.com/infertux/zeyple/fa214a3e4fa80a1fd5c7feed6a06a5506c23d140/zeyple/zeyple.py
